name: Terraform checks

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Terraform format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0
      - name: Check formatting
        run: terraform fmt -check -recursive -diff

  validate:
    name: Validate ${{ matrix.root }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - environments/bootstrap
          - environments/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0
      - name: Initialize backend if config exists
        run: |
          if [ -f "${{ matrix.root }}/backend.hcl" ]; then
            terraform -chdir="${{ matrix.root }}" init -backend-config=backend.hcl -input=false
          else
            terraform -chdir="${{ matrix.root }}" init -backend=false -input=false
          fi
      - name: Validate configuration
        run: terraform -chdir="${{ matrix.root }}" validate